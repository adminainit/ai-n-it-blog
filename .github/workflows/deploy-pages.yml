name: Build and Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    env:
      SITE_URL: "https://ai-n-it.com"
      BASE_PATH: ""
      PUBLIC_BUILD: "true"
      NODE_ENV: "production"
    steps:
      - name: Checkout public Astro source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Build Astro site
        run: npm run build

      - name: Validate public build
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/blog/index.html
          test -f dist/404.html
          test -f dist/rss.xml
          test -f dist/sitemap-index.xml
          test ! -d dist/admin
          if grep -R -E "href=[\"']/admin|src=[\"']/admin" dist --include='*.html'; then
            echo "Public build contains a local-only Admin link."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
